[project]
name = "networks-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []



[tool.ruff]
line-length = 88
indent-width = 2
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[project.scripts]
helper = "spotify.helper:main"
main = "spotify.helper:main"
